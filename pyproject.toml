[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "eventsourcing-sqlalchemy-async-adapter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["eventsourcing>=9.2,<10", "eventsourcing-sqlalchemy==1.0.1", "SQLAlchemy[asyncio]>=2.0.30,<3.0", "asyncpg>=0.29", "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30", "pydantic-settings>=2.4"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]
rabbitmq = ["aio-pika>=9.4"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
