services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: individuals
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d individuals"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
